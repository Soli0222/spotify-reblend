name: Weekly Auto Release

on:
  schedule:
    # Every Sunday at 22:00 UTC (07:00 JST)
    - cron: '0 22 * * 6'
  workflow_dispatch:

jobs:
  auto-merge-release-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Find pending release-please PR
        id: find-pr
        run: |
          pr_number=$(gh pr list --repo "$GITHUB_REPOSITORY" --label "autorelease: pending" --state open --json number --jq '.[0].number // empty')
          if [ -z "$pr_number" ]; then
            echo "No pending release-please PR found. Nothing to do."
            echo "pr_number=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Found pending release-please PR #$pr_number"
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"

      - name: Merge release PR
        id: merge-pr
        if: ${{ steps.find-pr.outputs.pr_number != '' }}
        run: |
          pr_number="${{ steps.find-pr.outputs.pr_number }}"

          if gh pr merge "$pr_number" --repo "$GITHUB_REPOSITORY" --squash --auto; then
            echo "Auto-merge enabled for PR #$pr_number"
          else
            echo "gh pr merge --auto failed, falling back to manual checks verification"
            if gh pr checks "$pr_number" --repo "$GITHUB_REPOSITORY"; then
              echo "Checks are green, merging directly"
              gh pr merge "$pr_number" --repo "$GITHUB_REPOSITORY" --squash
            else
              echo "Checks failed for PR #$pr_number, aborting"
              exit 1
            fi
          fi

      - name: Wait for PR to be merged
        id: wait-merge
        if: ${{ steps.find-pr.outputs.pr_number != '' }}
        run: |
          pr_number="${{ steps.find-pr.outputs.pr_number }}"
          merged="false"

          for _ in $(seq 1 24); do
            state=$(gh pr view "$pr_number" --repo "$GITHUB_REPOSITORY" --json state --jq '.state')
            if [ "$state" = "MERGED" ]; then
              merged="true"
              break
            fi
            sleep 5
          done

          if [ "$merged" != "true" ]; then
            echo "PR #$pr_number was not merged within the timeout"
            exit 1
          fi
          echo "PR #$pr_number merged"

      - name: Dispatch release-please workflow
        if: ${{ steps.find-pr.outputs.pr_number != '' }}
        run: gh workflow run release-please.yaml --repo "$GITHUB_REPOSITORY" --ref main
